name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      mc_versions:
        description: 'input subproject name'
        required: true
        type: string
        default: '26.3-fabric,26.3-neoforge,26.2-fabric,26.2-neoforge,26.1-fabric,26.1-neoforge,1.21.11-fabric,1.21.11-neoforge,1.21.1-fabric,1.21.1-neoforge,1.20.1-fabric,1.20.1-forge'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - id: set-matrix
        run: |
          VERSIONS='["'$(echo '${{ github.event.inputs.mc_versions }}' | sed 's/,/","/g')'"]'
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "Ready to release：$VERSIONS"

  release:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.prepare-matrix.outputs.versions) }}
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - uses: burrunan/gradle-cache-action@v1
        with:
          gradle-distribution-sha-256-sum-warning: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          cache: gradle
          java-version: 25

      - run: chmod +x gradlew

      - name: Get version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep "^mod.version=" gradle.properties | cut -d'=' -f2)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          fi
          if [ -z "$VERSION" ]; then
            echo "Version not found in gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build ${{ matrix.version }}
        run: ./gradlew ${{ matrix.version }}:build --no-daemon

      - name: Extract Current Version Changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          awk -v ver="$VERSION" '/^# / {if($0 ~ "# " ver) {flag=1} else {flag=0}} flag {print}' CHANGELOG.md > temp-changelog.md
          echo "prepared changelog："
          cat temp-changelog.md

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: JS88OZWj
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1719285
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-enabled: false
          files: versions/${{ matrix.version }}/build/libs/*.jar
          name: ${{ steps.get_version.outputs.version }} for ${{ matrix.version }}
          version: ${{ steps.get_version.outputs.version }}+${{ matrix.version }}
          changelog-file: temp-changelog.md
