name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      mc_versions:
        description: 'MC versions (mergeable: 26.1,26.2,26.3; per-loader: 1.21.11,1.21.1,1.20.1)'
        required: true
        type: string
        default: '26.3'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - id: set-matrix
        run: |
          VERSIONS='["'$(echo '${{ github.event.inputs.mc_versions }}' | sed 's/,/","/g')'"]'
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "Ready to release：$VERSIONS"

  release:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: ${{ fromJson(needs.prepare-matrix.outputs.versions) }}
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - uses: burrunan/gradle-cache-action@v1
        with:
          gradle-distribution-sha-256-sum-warning: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          cache: gradle
          java-version: 25

      - run: chmod +x gradlew

      - name: Get mod version from stonecutter.properties.toml
        id: get_version
        run: |
          VERSION=$(grep "^mod.version=" stonecutter.properties.toml | head -1 | cut -d'=' -f2 | tr -d '"')
          if [ -z "$VERSION" ]; then
            echo "mod.version not found in stonecutter.properties.toml"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected mod version: $VERSION"

      # 真实游戏版本号取自子工程 gradle.properties（如 26.1 -> 26.1.2）
      - name: Resolve real MC version
        id: mc_version
        run: |
          SUB=$(find versions -maxdepth 1 -type d -name "${{ matrix.mc }}-*" | head -1)
          if [ -z "$SUB" ]; then
            echo "No subproject found for ${{ matrix.mc }}"
            exit 1
          fi
          REAL_MC=$(grep "^deps.minecraft=" "$SUB/gradle.properties" | cut -d'=' -f2)
          echo "real_mc=$REAL_MC" >> $GITHUB_OUTPUT
          echo "Real MC version: $REAL_MC"

      - name: Extract Current Version Changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          awk -v ver="$VERSION" '/^# / {if($0 ~ "# " ver) {flag=1} else {flag=0}} flag {print}' CHANGELOG.md > temp-changelog.md
          echo "prepared changelog："
          cat temp-changelog.md

      # ---------- 判断是否为可合并版本 ----------
      - name: Check if mergeable
        id: mergeable
        run: |
          case "${{ matrix.mc }}" in
            26.1|26.2|26.3) echo "is_merged=true" >> $GITHUB_OUTPUT ;;
            *)              echo "is_merged=false" >> $GITHUB_OUTPUT ;;
          esac

      # ---------- 无混淆 26.x：Forgix 合并为单个跨 loader 产物 ----------
      - name: Merge build ${{ matrix.mc }} (forgix)
        if: steps.mergeable.outputs.is_merged == 'true'
        run: ./gradlew mergeJars -Pforgix.mc=${{ matrix.mc }} --no-daemon

      - name: Publish merged ${{ matrix.mc }} to Modrinth & CurseForge
        if: steps.mergeable.outputs.is_merged == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: JS88OZWj
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1719285
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-enabled: false
          files: build/merged/*.jar
          name: ${{ steps.get_version.outputs.version }} for ${{ matrix.mc }}
          version: ${{ steps.get_version.outputs.version }}+${{ matrix.mc }}
          loaders: fabric,neoforge
          game-versions: ${{ steps.mc_version.outputs.real_mc }}
          changelog-file: temp-changelog.md

      # ---------- 1.21.x / 1.20.x 仍混淆：每-loader 单独产物 ----------
      - name: Build ${{ matrix.mc }} per-loader
        if: steps.mergeable.outputs.is_merged == 'false'
        run: |
          for SUB in versions/${{ matrix.mc }}-*; do
            NAME=$(basename "$SUB")
            echo "=== Building $NAME ==="
            ./gradlew "$NAME:build" --no-daemon
          done

      - name: Publish per-loader ${{ matrix.mc }} to Modrinth & CurseForge
        if: steps.mergeable.outputs.is_merged == 'false'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: JS88OZWj
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1719285
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-enabled: false
          files: 'versions/${{ matrix.mc }}-*/build/libs/*.jar'
          name: ${{ steps.get_version.outputs.version }} for ${{ matrix.mc }}
          version: ${{ steps.get_version.outputs.version }}+${{ matrix.mc }}
          game-versions: ${{ steps.mc_version.outputs.real_mc }}
          changelog-file: temp-changelog.md
